services:
  - type: web
    name: collabai-frontend
    env: node
    rootDir: frontend
    buildCommand: |
      npm install
      npm run build
      cp -r .next /opt/render/project/
    startCommand: |
      cp -r /opt/render/project/.next .
      npx next start -p 10000
    envVars:
      - key: NODE_VERSION
        value: 18.17.0
      - key: PORT
        value: 10000
