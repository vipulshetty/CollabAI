services:
  - type: web
    name: collabai-frontend
    env: node
    rootDir: frontend
    buildCommand: |
      npm install
      npm run build
    startCommand: |
      npm install next@latest
      NODE_ENV=production node server.js
    envVars:
      - key: NODE_VERSION
        value: 18.17.0
      - key: PORT
        value: 3000
