services:
  - type: web
    name: collabai-frontend
    env: node
    rootDir: frontend
    buildCommand: |
      npm install
      npm install -g next
    startCommand: |
      npm run build
      ./node_modules/.bin/next start -p $PORT
    envVars:
      - key: NODE_VERSION
        value: 18.17.0
      - key: PORT
        value: 3000
